<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>BASTION — vérification des formats</title><style>body{margin:0;background:#0c1510;color:#e4ecdf;font:14px system-ui}header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #344834}select,button{font:inherit;color:inherit;background:#273e2b;border:1px solid #5c7252;border-radius:7px;padding:10px}main{padding:16px;width:max-content;margin:auto}iframe{display:block;border:1px solid #405a3a;border-radius:16px;background:#122019}p{margin:8px 0;color:#91a58b;font-size:12px}</style><header><strong>Formats de vérification</strong><label>Téléphone <select id="format"><option value="390,844">390 × 844</option><option value="360,740">360 × 740</option><option value="375,667">375 × 667</option><option value="320,568">320 × 568</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390 · paysage</option><option value="1280,900">1280 × 900 · bureau</option></select></label><a href="../" style="color:#c8ee8b">Ouvrir le jeu</a></header><main><iframe id="game-frame" title="BASTION" src="../?release=portrait-1.1.1" width="390" height="844" allow="fullscreen"></iframe><p>Cadre de navigateur réel. Les performances dépendent de l’appareil utilisé.</p></main><script>document.getElementById('format').onchange=e=>{const [width,height]=e.target.value.split(',');const frame=document.getElementById('game-frame');frame.width=width;frame.height=height;};</script></html>
